<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nilo Raider</title>
    <link rel="stylesheet" href="./css/style.css" />
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.6.0/dist/aframe-extras.min.js"></script>
    <script src="https://unpkg.com/aframe-environment-component@1.5.x/dist/aframe-environment-component.min.js"></script>
  </head>
  <body>
    <a-scene vr-mode-ui="enabled: true" embedded style="height: 100vh; width: 100vw" background="color: #87CEEB">
      <a-assets>
        <img id="carpeTex" src="./assets/carpetex2.png" />
      </a-assets>
      <a-light type="ambient" color="#fff" intensity=".5"></a-light>
      <a-light type="directional" position="5 10 5" color="#ffffff" intensity="0.8" castShadow="true"></a-light>

      <a-entity id="riverRaidManager" river-raid-proc></a-entity>
      <a-entity id="cameraRig" position="0 2 0" river-raid-controls>
        <a-camera
          id="mainCamera"
          position="0 2 0"
          look-controls="enabled: true; pointerLockEnabled: true"
          wasd-controls="enabled: false;"
        ></a-camera>

        <a-entity
          environment="skyType: atmosphere;horizonColor: #ddd;lightPosition: 0 0.1 -5;fog: 0.9; lighting: distant; shadow: true;  ground: none; horizonColor: #b3e0ff; seed: 42;stageSize: 5000; playArea: 50"
        ></a-entity>
        <a-entity
          meta-touch-controls="hand: right; model: true"
          laser-controls="hand: right"
          class="right-control"
        ></a-entity>
        <a-entity
          meta-touch-controls="hand: left; model: true"
          laser-controls="hand: left"
          class="left-control"
        ></a-entity>

        <!-- VR Start Panel -->
        <a-entity id="vr-start-panel" position="0 2.5 -5" visible="false">
          <!-- Fundo -->
          <a-plane width="6" height="7" color="#0a0a14" material="opacity: 0.98; side: double;"></a-plane>
          <!-- Borda -->
          <a-plane
            width="6.1"
            height="7.1"
            color="#4CC3D9"
            position="0 0 -0.05"
            material="opacity: 0.5; side: double; transparent: true;"
          ></a-plane>
          <!-- Título -->
          <a-text
            value="NILO RAIDER"
            align="center"
            anchor="center"
            color="#4CC3D9"
            font="mozillavr"
            height="20"
            width="20"
            position="0 3.15 0.1"
          ></a-text>
          <!-- Instruções -->
          <a-text
            value="Thumbstick: Move&#10;Trigger: Fire&#10;&#10;Gold: 100 pts&#10;Silver: 50 pts&#10;Bronze: 25 pts&#10;Ruby: 150 pts&#10;&#10;AVOID BLACK CRYSTAL!"
            align="center"
            anchor="center"
            color="#ffffff"
            font="mozillavr"
            font-size="5"
            width="10"
            line-height="80"
            position="0 0.4 0.1"
          ></a-text>
          <!-- Botão START -->
          <a-plane
            id="vr-start-button"
            width="2.5"
            height="0.8"
            color="#7BC8A4"
            position="0 -2.5 0.15"
            material="opacity: 0.95;"
            data-clickable="true"
          ></a-plane>
          <!-- Texto do botão -->
          <a-text
            value="START GAME"
            align="center"
            anchor="center"
            color="#000000"
            font="mozillavr"
            font-size="60"
            width="8"
            position="0 -2.3 0.2"
            material="emissive: #FFD700; emissiveIntensity: 0.5;"
          ></a-text>
        </a-entity>

        <!-- VR Game Over Panel -->
        <a-entity id="vr-game-over-panel" position="0 2.5 -5" visible="false">
          <!-- Fundo -->
          <a-plane width="6" height="7" color="#1a0a1a" material="opacity: 0.98; side: double;"></a-plane>
          <!-- Borda -->
          <a-plane
            width="6.1"
            height="7.1"
            color="#ff6b6b"
            position="0 0 -0.05"
            material="opacity: 0.5; side: double; transparent: true;"
          ></a-plane>
          <!-- Título -->
          <a-text
            value="GAME OVER"
            align="center"
            anchor="center"
            color="#ff6b6b"
            font="mozillavr"
            height="20"
            width="20"
            position="0 3 0.1"
          ></a-text>
          <!-- Label Score Final -->
          <a-text
            value="FINAL SCORE"
            align="center"
            anchor="center"
            color="#FFD700"
            font="mozillavr"
            width="10"
            position="0 1.5 0.1"
          ></a-text>
          <!-- Score Final -->
          <a-text
            id="vr-final-score"
            value="0"
            align="center"
            anchor="center"
            color="#FFD700"
            font="mozillavr"
            width="15"
            position="0 1 0.1"
          ></a-text>
          <!-- Label High Score -->
          <a-text
            value="HIGH SCORE"
            align="center"
            anchor="center"
            color="#4CC3D9"
            font="mozillavr"
            width="8"
            position="0 -0.4 0.1"
          ></a-text>
          <!-- High Score -->
          <a-text
            id="vr-highscore"
            value="0"
            align="center"
            anchor="center"
            color="#4CC3D9"
            font="mozillavr"
            width="12"
            position="0 -0.8 0.1"
          ></a-text>
          <!-- Botão RESTART -->
          <a-plane
            id="vr-restart-button"
            width="2.5"
            height="0.8"
            color="#7BC8A4"
            position="0 -2.5 0.15"
            material="opacity: 0.95;"
            data-clickable="true"
          ></a-plane>
          <!-- Texto do botão -->
          <a-text
            value="RESTART"
            align="center"
            anchor="center"
            color="#000000"
            font="mozillavr"
            font-size="60"
            width="8"
            position="0 -2.3 0.2"
            material="emissive: #FFD700; emissiveIntensity: 0.5;"
          ></a-text>
        </a-entity>
      </a-entity>
    </a-scene>
    <script type="module" src="./js/river-raid-proc.js"></script>
  </body>
</html>
