<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wacky Works VR - Interactive Virtual Reality Game</title>

    <!-- A-Frame CDN -->
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-environment-component@1.5.x/dist/aframe-environment-component.min.js"></script>

    <!-- Physics System (Cannon.js) -->
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-physics-system@v4.0.1/dist/aframe-physics-system.min.js"></script>

    <!-- CSS personalizado -->
    <link rel="stylesheet" href="./css/style.css" />
    <style>
      body {
        margin: 0;
        overflow: hidden;
      }

      #enter-vr-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 1000;
        font-family: Arial, sans-serif;
        transition: opacity 0.5s;
      }

      #enter-vr-overlay.hidden {
        opacity: 0;
        pointer-events: none;
      }

      .vr-prompt {
        text-align: center;
        color: white;
      }

      .vr-prompt h1 {
        font-size: 3rem;
        margin-bottom: 1rem;
        text-shadow: 0 0 20px #00ffff;
        animation: glow 2s ease-in-out infinite alternate;
      }

      .vr-prompt p {
        font-size: 1.2rem;
        margin-bottom: 2rem;
        opacity: 0.8;
      }

      .enter-vr-button {
        background: linear-gradient(45deg, #00ffff, #0080ff);
        border: none;
        border-radius: 50px;
        padding: 1.5rem 3rem;
        font-size: 1.5rem;
        font-weight: bold;
        color: white;
        cursor: pointer;
        transition: all 0.3s ease;
        text-transform: uppercase;
        letter-spacing: 2px;
      }

      .enter-vr-button:hover {
        transform: translateY(-5px);
        box-shadow: 0 10px 30px rgba(0, 255, 255, 0.5);
        background: linear-gradient(45deg, #00ffff, #0066cc);
      }

      .enter-vr-button:active {
        transform: translateY(-2px);
      }

      @keyframes glow {
        from {
          text-shadow: 0 0 20px #00ffff;
        }
        to {
          text-shadow:
            0 0 30px #00ffff,
            0 0 40px #0080ff;
        }
      }

      .version {
        position: absolute;
        bottom: 1rem;
        right: 1rem;
        color: rgba(255, 255, 255, 0.5);
        font-size: 0.8rem;
      }
    </style>
  </head>
  <body>
    <!-- Overlay para entrar em VR -->
    <div id="enter-vr-overlay">
      <div class="vr-prompt">
        <h1>🎮 WACKY WORKS VR 🎮</h1>
        <p>Interactive Virtual Reality Game</p>
        <button class="enter-vr-button" onclick="enterVR()">🥽 ENTER VR</button>
      </div>
      <div class="version">v1.0.0</div>
    </div>

    <!-- Cena A-Frame -->
    <a-scene
      vr-mode-ui="enabled: true"
      embedded
      style="height: 100vh; width: 100vw"
      background="color: #1a1a2e"
      fog="type: linear; color: #1a1a2e; near: 10; far: 100"
    >
      <!-- Assets -->

      <!-- Ambiente -->
      <a-entity environment="preset: starry;"></a-entity>

      <!-- Container do Menu VR -->
      <a-entity id="vr-main-menu" position="0 1.6 -5" visible="false">
        <!-- Título 3D -->
        <a-text
          value="WACKY WORKS VR"
          align="center"
          color="#00FFFF"
          width="8"
          position="0 2 0"
          font="roboto"
          wrap-count="30"
          animation="property: scale; to: 1.05 1.05 1.05; dur: 2000; dir: alternate; loop: true"
        ></a-text>

        <!-- Botão Tutorial -->
        <a-entity
          id="btn-tutorial"
          vr-button="label: 🎓 Tutorial; width: 3; height: 0.7; color: #4CC3D9; action: tutorial"
          position="0 0.5 0"
        ></a-entity>

        <!-- Botão Jogar -->
        <a-entity
          id="btn-play"
          vr-button="label: 🎮 Play; width: 3; height: 0.7; color: #7BC8A4; action: play"
          position="0 -0.3 0"
        ></a-entity>

        <!-- Botão Sobre -->
        <a-entity
          id="btn-about"
          vr-button="label: ℹ️ About; width: 3; height: 0.7; color: #FFC65D; action: about"
          position="0 -1.1 0"
        ></a-entity>

        <!-- Instruções -->
        <a-text
          value="Aponte e clique nos botões com o controle VR"
          align="center"
          color="#FFFFFF"
          width="6"
          position="0 -2 0"
          font="roboto"
          wrap-count="40"
          opacity="0.7"
        ></a-text>
      </a-entity>

      <!-- Painel Sobre (inicialmente invisível) -->
      <a-entity id="about-panel" position="0 1.6 -5" visible="false">
        <a-plane width="4" height="3" color="#1a1a2e" material="opacity: 0.95; transparent: true"></a-plane>

        <a-text
          value="ABOUT WACKY WORKS VR"
          align="center"
          color="#00FFFF"
          width="7"
          position="0 1.2 0.01"
          font="roboto"
        ></a-text>

        <a-text
          value="A virtual reality game where you\nconnect 3D objects to complete\ndifferent difficulty levels.\n\nTechnologies:\nA-Frame, WebXR, THREE.js\n\nDeveloped by: Hugo Euzebio"
          align="center"
          color="#FFFFFF"
          width="7"
          position="0 0 0.01"
          font="roboto"
          wrap-count="35"
          line-height="50"
        ></a-text>

        <a-entity
          vr-button="label: Voltar; width: 2; height: 0.5; color: #FF6B6B; action: back-to-menu"
          position="0 -1.2 0.01"
        ></a-entity>
      </a-entity>

      <!-- Rig VR/Câmera -->
      <a-entity id="cameraRig" position="0 0 0" movement-controls="fly: false; constrainToNavMesh: false">
        <!-- Câmera -->
        <a-camera id="mainCamera" look-controls wasd-controls="acceleration: 20">
          <!-- Cursor para interação (desativado em VR via script) -->
          <a-cursor
            id="uiCursor"
            vr-cursor-visual
            raycaster="objects: .interactive"
            animation__click="property: scale; startEvents: click; from: 0.1 0.1 0.1; to: 1 1 1; dur: 150"
            fuse="false"
          ></a-cursor>
        </a-camera>

        <!-- Controle VR Direito -->
        <a-entity
          id="rightController"
          laser-controls="hand: right"
          raycaster="objects: .interactive; lineColor: #00FFFF; lineOpacity: 0.5"
        ></a-entity>

        <!-- Controle VR Esquerdo -->
        <a-entity
          id="leftController"
          laser-controls="hand: left"
          raycaster="objects: .interactive; lineColor: #00FF00; lineOpacity: 0.5"
        ></a-entity>
      </a-entity>
    </a-scene>

    <!-- Scripts -->
    <script src="./components/vr-ui-components.js"></script>
    <script type="module" src="./utils/scene-manager.js"></script>
    <script type="module">
      import { SceneManager } from './utils/scene-manager.js';

      let vrMenuVisible = false;

      // Função para entrar em VR
      window.enterVR = function () {
        const overlay = document.getElementById('enter-vr-overlay');
        const vrMenu = document.getElementById('vr-main-menu');
        const scene = document.querySelector('a-scene');

        // Remove overlay 2D
        overlay.classList.add('hidden');
        setTimeout(() => {
          overlay.style.display = 'none';
        }, 500);

        // Mostra menu VR
        if (vrMenu) {
          setTimeout(() => {
            vrMenu.setAttribute('visible', true);
            vrMenuVisible = true;
          }, 500);
        }

        // Tenta entrar em modo VR automaticamente se disponível
        if (scene && scene.is('vr-mode')) {
          scene.enterVR();
        }
      };

      // Event listeners para os botões VR
      document.addEventListener('DOMContentLoaded', () => {
        const scene = document.querySelector('a-scene');

        if (scene.hasLoaded) {
          setupVRMenu();
        } else {
          scene.addEventListener('loaded', setupVRMenu);
        }
      });

      function setupVRMenu() {
        const btnTutorial = document.getElementById('btn-tutorial');
        const btnPlay = document.getElementById('btn-play');
        const btnAbout = document.getElementById('btn-about');
        const aboutPanel = document.getElementById('about-panel');
        const vrMenu = document.getElementById('vr-main-menu');
        const scene = document.querySelector('a-scene');
        const uiCursor = document.getElementById('uiCursor');

        // Esconder cursor quando entrar em VR e mostrar ao sair
        if (scene) {
          scene.addEventListener('enter-vr', () => {
            if (uiCursor) {
              uiCursor.setAttribute('visible', false);
              // desativa raycaster do cursor em VR
              uiCursor.removeAttribute('raycaster');
            }
          });
          scene.addEventListener('exit-vr', () => {
            if (uiCursor) {
              uiCursor.setAttribute('visible', true);
              uiCursor.setAttribute('raycaster', 'objects: .interactive');
            }
          });
        }

        // Tutorial
        if (btnTutorial) {
          btnTutorial.addEventListener('vr-button-clicked', () => {
            console.log('Tutorial clicked');
            SceneManager.loadScene('tutorial');
          });
        }

        // Jogar
        if (btnPlay) {
          btnPlay.addEventListener('vr-button-clicked', () => {
            console.log('Play clicked');
            SceneManager.loadScene('level-select');
          });
        }

        // Sobre
        if (btnAbout) {
          btnAbout.addEventListener('vr-button-clicked', () => {
            console.log('About clicked');
            if (vrMenu) vrMenu.setAttribute('visible', false);
            if (aboutPanel) aboutPanel.setAttribute('visible', true);
          });
        }

        // Voltar do Sobre
        const backButton = aboutPanel?.querySelector('[vr-button]');
        if (backButton) {
          backButton.addEventListener('vr-button-clicked', () => {
            console.log('Back to menu clicked');
            if (aboutPanel) aboutPanel.setAttribute('visible', false);
            if (vrMenu) vrMenu.setAttribute('visible', true);
          });
        }

        // Atalhos de teclado para desenvolvimento
        document.addEventListener('keydown', event => {
          switch (event.key) {
            case '1':
              SceneManager.loadScene('tutorial');
              break;
            case '2':
              SceneManager.loadScene('level-select');
              break;
            case '3':
              SceneManager.loadScene('game', { difficulty: 'easy' });
              break;
            case 'Enter':
              if (!vrMenuVisible) {
                enterVR();
              }
              break;
          }
        });
      }
    </script>
  </body>
</html>
