<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game - Wacky Works VR</title>

    <!-- CSS personalizado -->
    <link rel="stylesheet" href="../css/style.css" />

    <!-- A-Frame CDN -->
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-environment-component@1.5.x/dist/aframe-environment-component.min.js"></script>

    <!-- Physics System (Cannon.js) -->
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-physics-system@v4.0.1/dist/aframe-physics-system.min.js"></script>
  </head>
  <body>
    <!-- Cena A-Frame -->
    <a-scene
      vr-mode-ui="enabled: true"
      style="height: 100vh; width: 100vw"
      background="color: #1a1a2e"
      fog="type: linear; color: #1a1a2e; near: 10; far: 100"
      physics="driver: cannon; debug: false"
      game-manager
    >
      <!-- Assets -->
      <a-assets>
        <!-- Texturas -->
        <img id="groundTexture" src="https://cdn.aframe.io/a-painter/images/floor.jpg" />

        <!-- Mixins para objetos -->
        <a-mixin id="interactive-object" shadow="cast: true; receive: true" class="interactive grab"></a-mixin>
      </a-assets>

      <!-- Iluminação dinâmica -->
      <a-light type="ambient" color="#2a2a4a" intensity=".4"></a-light>
      <a-light type="directional" position="5 10 5" color="#ffffff" intensity="0.8" castShadow="true"></a-light>

      <!-- Luzes coloridas para destacar início e fim -->
      <a-light id="start-light" type="point" color="#00ff00" intensity="0.8" distance="10" visible="false"></a-light>
      <a-light id="end-light" type="point" color="#ff0000" intensity="0.8" distance="10" visible="false"></a-light>

      <!-- Ambiente -->
      <a-entity environment="preset: starry; groundColor: #1a1a2e; horizonColor: #000000"></a-entity>

      <!-- Plataforma central -->
      <a-cylinder
        id="game-platform"
        position="0 0 -6"
        radius="12"
        height="0.3"
        color="#2a2a4a"
        shadow="receive: true"
        material="metalness: 0.6; roughness: 0.4"
        static-body
      ></a-cylinder>

      <!-- Chão físico invisível (colisão) -->
      <a-plane position="0 -0.15 -6" rotation="-90 0 0" width="24" height="24" static-body visible="false"></a-plane>

      <!-- HUD VR fixo na câmera -->
      <a-entity id="vr-hud" position="0 2.5 -3" visible="false">
        <!-- Painel de informações do jogo -->
        <a-plane
          width="3"
          height="1.5"
          color="#1a1a2e"
          material="opacity: 0.85; transparent: true"
          position="0 0 0"
        ></a-plane>

        <!-- Título do nível -->
        <a-text
          id="vr-level-title"
          value="Nível Fácil"
          align="center"
          color="#00FFFF"
          width="5"
          position="0 0.55 0.01"
          font="roboto"
        ></a-text>

        <!-- Objetivo -->
        <a-text
          id="vr-objective"
          value="Conecte os objetos do início ao fim"
          align="center"
          color="#FFFFFF"
          width="5.5"
          position="0 0.2 0.01"
          font="roboto"
          wrap-count="40"
        ></a-text>

        <!-- Progresso -->
        <a-text
          id="vr-progress"
          value="Progresso: 0 / 3"
          align="center"
          color="#7BC8A4"
          width="5"
          position="0 -0.1 0.01"
          font="roboto"
        ></a-text>

        <!-- Timer -->
        <a-text
          id="vr-timer"
          value="Tempo: 00:00"
          align="center"
          color="#FFC65D"
          width="5"
          position="0 -0.4 0.01"
          font="roboto"
        ></a-text>
      </a-entity>

      <!-- Painel de botões VR (fixo no mundo) -->
      <a-entity id="vr-controls-panel" position="-4 1.5 -3" rotation="0 20 0">
        <!-- Botão Dica -->
        <a-entity
          id="btn-hint"
          vr-button="label: 💡 Dica; width: 1.5; height: 0.4; color: #FFC65D; action: hint"
          position="0 0.5 0"
        ></a-entity>

        <!-- Botão Reiniciar -->
        <a-entity
          id="btn-reset"
          vr-button="label: 🔄 Reiniciar; width: 1.5; height: 0.4; color: #FF6B6B; action: reset"
          position="0 0 0"
        ></a-entity>

        <!-- Botão Voltar -->
        <a-entity
          id="btn-back"
          vr-button="label: ← Voltar; width: 1.5; height: 0.4; color: #4CC3D9; action: back"
          position="0 -0.5 0"
        ></a-entity>
      </a-entity>

      <!-- Painel de Vitória VR (inicialmente invisível) -->
      <a-entity id="victory-panel-vr" position="0 1.6 -5" visible="false">
        <!-- Fundo do painel -->
        <a-plane width="4" height="3" color="#1a1a2e" material="opacity: 0.95; transparent: true"></a-plane>

        <!-- Título de vitória -->
        <a-text
          value="🎉 PARABÉNS! 🎉"
          align="center"
          color="#00FFFF"
          width="7"
          position="0 1.2 0.01"
          font="roboto"
        ></a-text>

        <!-- Mensagem -->
        <a-text
          value="Você completou o nível com sucesso!"
          align="center"
          color="#FFFFFF"
          width="7"
          position="0 0.7 0.01"
          font="roboto"
          wrap-count="35"
        ></a-text>

        <!-- Stats de vitória -->
        <a-text
          id="victory-time-vr"
          value="Tempo: 00:00"
          align="center"
          color="#FFC65D"
          width="6"
          position="0 0.2 0.01"
          font="roboto"
        ></a-text>

        <a-text
          id="victory-connections-vr"
          value="Conexões: 0"
          align="center"
          color="#7BC8A4"
          width="6"
          position="0 -0.1 0.01"
          font="roboto"
        ></a-text>

        <!-- Botões -->
        <a-entity
          vr-button="label: 🎮 Próximo Nível; width: 2.5; height: 0.5; color: #7BC8A4; action: next"
          position="0 -0.7 0.01"
        ></a-entity>

        <a-entity
          vr-button="label: 🔄 Jogar Novamente; width: 2.5; height: 0.5; color: #FFC65D; action: replay"
          position="0 -1.3 0.01"
        ></a-entity>

        <a-entity
          vr-button="label: ← Menu Principal; width: 2.5; height: 0.5; color: #FF6B6B; action: menu"
          position="0 -1.9 0.01"
        ></a-entity>
      </a-entity>

      <!-- Container para objetos gerados dinamicamente -->
      <a-entity id="game-objects"></a-entity>

      <!-- Container para conexões -->
      <a-entity id="connections"></a-entity>

      <!-- Indicadores visuais -->
      <a-text
        id="start-indicator"
        value="INÍCIO"
        position="0 5 -6"
        align="center"
        color="#00ff00"
        font="roboto"
        width="8"
        visible="false"
        animation="property: position; to: 0 5.5 -6; dur: 2000; dir: alternate; loop: true"
      ></a-text>

      <a-text
        id="end-indicator"
        value="FIM"
        position="0 5 -6"
        align="center"
        color="#ff0000"
        font="roboto"
        width="8"
        visible="false"
        animation="property: position; to: 0 5.5 -6; dur: 2000; dir: alternate; loop: true"
      ></a-text>

      <!-- Feedback VR -->
      <a-entity
        id="game-feedback-vr"
        position="0 2.8 -4"
        vr-feedback="message: ; duration: 3000; color: #00FFFF"
      ></a-entity>

      <!-- Partículas de ambiente -->
      <a-entity id="ambient-particles">
        <!-- Partículas serão adicionadas dinamicamente -->
      </a-entity>

      <!-- Rig VR/Câmera -->
      <a-entity
        id="cameraRig"
        position="0 0 0"
        movement-controls="fly: false; constrainToNavMesh: false"
        snap-turn-controls="turnAngle: 45"
      >
        <!-- Câmera -->
        <a-camera
          id="mainCamera"
          position="0 1.6 8"
          look-controls="enabled: true; pointerLockEnabled: true"
          wasd-controls="enabled: true; acceleration: 20"
          cursor="rayOrigin: mouse"
          raycaster="objects: .interactive, .clickable, .grab; far: 50; showLine: true"
        >
          <!-- Cursor VR -->
          <a-cursor
            vr-cursor-visual
            raycaster="objects: .interactive"
            animation__click="property: scale; startEvents: click; from: 0.1 0.1 0.1; to: 1 1 1; dur: 150"
            fuse="false"
          ></a-cursor>
        </a-camera>

        <!-- Controles VR com grab handler melhorado -->
        <a-entity
          id="leftController"
          laser-controls="hand: left"
          raycaster="objects: .grab, .interactive; showLine: true; far: 50; lineColor: cyan; lineOpacity: 0.8"
          game-grab-handler
        ></a-entity>
        <a-entity
          id="rightController"
          laser-controls="hand: right"
          raycaster="objects: .grab, .interactive; showLine: true; far: 50; lineColor: cyan; lineOpacity: 0.8"
          game-grab-handler
        ></a-entity>
      </a-entity>

      <!-- Efeitos visuais de fundo -->
      <a-entity id="background-effects">
        <!-- Estrelas distantes -->
        <a-entity id="distant-stars" position="0 0 -50">
          <!-- Estrelas serão adicionadas dinamicamente -->
        </a-entity>

        <!-- Nebulosa de fundo -->
        <a-sphere
          position="0 0 -100"
          radius="80"
          material="color: #440066; opacity: 0.1; transparent: true; side: back"
          animation="property: rotation; to: 0 360 0; dur: 120000; loop: true"
        ></a-sphere>
      </a-entity>
    </a-scene>

    <!-- Scripts -->
    <script src="../components/vr-ui-components.js"></script>
    <script type="module" src="../utils/scene-manager.js"></script>
    <script type="module" src="../utils/level-generator.js"></script>
    <script type="module" src="../utils/physics-config.js"></script>

    <!-- Componentes -->
    <script src="../components/base-component.js"></script>
    <script src="../components/cube-component.js"></script>
    <script src="../components/sphere-component.js"></script>
    <script src="../components/cylinder-component.js"></script>
    <script src="../components/cone-component.js"></script>
    <script src="../components/torus-component.js"></script>
    <script src="../components/lever-component.js"></script>
    <script src="../components/physics-connector.js"></script>

    <!-- Game Logic -->
    <script type="module" src="../js/game.js"></script>
  </body>
</html>
