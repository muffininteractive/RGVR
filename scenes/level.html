<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Level - Wacky Works VR</title>

    <!-- CSS -->
    <link rel="stylesheet" href="../css/style.css" />
    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
    <!-- Environment Component -->
    <script src="https://unpkg.com/aframe-environment-component@1.5.x/dist/aframe-environment-component.min.js"></script>

    <!-- Physics System (Cannon.js) -->
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-physics-system@v4.2.2/dist/aframe-physics-system.min.js"></script>

    <!-- Particle System -->
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-particle-system-component@1.2.0/dist/aframe-particle-system-component.min.js"></script>
    <!-- Components -->
    <script type="module" src="../js/level-manager.js"></script>
  </head>
  <body>
    <!-- A-Frame Scene with Physics -->
    <a-scene id="main-scene" physics="debug: false;">
      <!-- Assets -->
      <a-assets>
        <img src="../assets/imgs/flame.png" id="flameTex" />
        <img src="../assets/imgs/grab.png" id="grabTex" />
        <img src="../assets/imgs/roll.png" id="rollTex" />
        <img src="../assets/imgs/scroll.png" id="scrollTex" />
        <img src="../assets/imgs/sprite.png" id="spriteTex" />
        <img src="../assets/imgs/soccer2.png" id="soccerTex" />
        <img src="../assets/imgs/colors.png" id="colorsTex" />

        <!-- Textures and sounds can be added here -->
      </a-assets>

      <!-- 3D Environment (will be configured dynamically) -->
      <a-entity position="0 0 0" id="environment"></a-entity>

      <!-- Lighting -->
      <a-light type="ambient" color="#ffffff" intensity="0.6"></a-light>

      <a-light type="point" position="0 5 0" color="#00ffff" intensity="0.5"></a-light>

      <a-light
        type="directional"
        position="5 10 5"
        intensity="0.8"
        light="castShadow: true; shadowCameraTop: 20"
      ></a-light>

      <!-- Visual Grid -->
      <a-plane
        position="0 -0.1 0"
        rotation="-90 0 0"
        width="30"
        height="30"
        material="shader: flat; transparent: true; opacity: 0"
        static-body="friction: 0.1; restitution: 1"
      ></a-plane>

      <!-- Objective Panel (will be updated dynamically) -->
      <a-entity id="objective-panel" position="0 6 -9">
        <a-text id="timer-text" value="00:00" position="0 0 0" align="center" color="#fff" width="4"></a-text>
      </a-entity>

      <!-- Level elements will be created dynamically by level-manager -->

      <!-- UI: Control Buttons -->
      <a-entity scale="0.5 0.5 0.5" position="0 .5 4">
        <a-entity id="btn-play" position="-2.5 0 0" rotation="0 0 0" level-play-button></a-entity>

        <a-entity id="btn-restart" position="0 0 0" level-restart-button></a-entity>

        <!-- Menu Button -->
        <a-entity id="btn-menu" position="2.5 0 0" level-menu-button></a-entity>
      </a-entity>

      <!-- Victory Panel (initially invisible; not interactive until shown) -->
      <a-entity id="victory-panel" position="0 5 -2" visible="false" victory-panel>
        <a-text id="victory-time" value="" position="0 0.5 0" align="center" color="#fff" width="4"></a-text>
        <a-text id="victory-stats" value="" position="0 -0.2 0" align="center" color="#fff" width="4"></a-text>
      </a-entity>

      <!-- Celebration Effect -->
      <a-entity celebration-effect></a-entity>

      <!-- VR Rig/Camera with full controls -->
      <a-entity
        id="cameraRig"
        position="0 0 6"
        movement-controls="fly: false; constrainToNavMesh: false"
        snap-turn-controls="turnAngle: 45"
      >
        <!-- Camera -->
        <a-camera
          id="mainCamera"
          position="0 1.7 0"
          look-controls="enabled: false; pointerLockEnabled: false"
          wasd-controls="enabled: false; acceleration: 20"
          cursor="rayOrigin: mouse"
        >
        </a-camera>

        <!-- VR Controls -->
        <a-entity
          id="leftHand"
          laser-controls="hand: left"
          raycaster="objects: .interactive; lineColor: #00ffff; lineOpacity: 0.5"
        ></a-entity>

        <a-entity
          id="rightHand"
          laser-controls="hand: right"
          raycaster="objects: .interactive; lineColor: #00ffff; lineOpacity: 0.5"
        ></a-entity>
      </a-entity>

      <!-- Invisible Walls (boundaries) -->
      <a-box position="15 2 0" width="1" height="4" depth="30" static-body visible="false"></a-box>
      <a-box position="-15 2 0" width="1" height="4" depth="30" static-body visible="false"></a-box>
      <a-box position="0 2 -15" width="30" height="4" depth="1" static-body visible="false"></a-box>
      <a-box position="0 2 15" width="30" height="4" depth="1" static-body visible="false"></a-box>
    </a-scene>
  </body>
</html>
