<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Level Select - Wacky Works VR</title>

    <!-- CSS personalizado -->
    <link rel="stylesheet" href="../css/style.css" />

    <!-- A-Frame CDN -->
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-environment-component@1.5.x/dist/aframe-environment-component.min.js"></script>
    <script src="https://unpkg.com/aframe-particle-system-component@1.1.4/dist/aframe-particle-system-component.min.js"></script>
  </head>
  <body>
    <!-- Cena A-Frame -->
    <a-scene
      vr-mode-ui="enabled: true"
      style="height: 100vh; width: 100vw"
      background="color: #1a1a2e"
      fog="type: linear; color: #1a1a2e; near: 5; far: 50"
    >
      <!-- Assets -->
      <a-assets>
        <!-- Texturas -->
        <img id="starTexture" src="https://cdn.aframe.io/360-image-gallery-boilerplate/img/thumb-cubes.jpg" />

        <!-- Sons (placeholder) -->
        <audio id="hoverSound" preload="auto"></audio>
        <audio id="selectSound" preload="auto"></audio>
      </a-assets>

      <!-- Iluminação -->
      <a-light type="ambient" color="#2a2a4a" intensity="0.5"></a-light>
      <a-light type="directional" position="5 10 5" color="#ffffff" intensity="0.6" castShadow="true"></a-light>
      <a-light type="point" position="0 5 0" color="#00ffff" intensity="0.8" distance="25"></a-light>

      <!-- Ambiente -->
      <a-entity environment="preset: starry; groundColor: #1a1a2e; horizonColor: #000000"></a-entity>

      <!-- Plataforma central -->
      <a-cylinder
        position="0 0 -10"
        radius="18"
        height="0.3"
        color="#2a2a4a"
        shadow="receive: true"
        material="metalness: 0.7; roughness: 0.3"
      ></a-cylinder>

      <!-- Título em VR -->
      <a-text
        value="LEVEL SELECT"
        position="0 6 -10"
        align="center"
        color="#00FFFF"
        width="10"
        animation="property: scale; to: 1.05 1.05 1.05; dur: 2000; dir: alternate; loop: true"
      ></a-text>

      <!-- Subtítulo -->
      <a-text
        value="Choose your difficulty level"
        position="0 5.3 -10"
        align="center"
        color="#FFFFFF"
        width="8"
        opacity="0.8"
      ></a-text>

      <!-- Instruções gerais -->
      <a-text
        value="Point at a crystal and click to select the level"
        position="0 4.7 -10"
        align="center"
        color="#ffffff"
        width="8"
        wrap-count="50"
        opacity="0.7"
      ></a-text>

      <!-- Painel de informações do nível (HUD VR) - Reposicionado para trás e para cima -->
      <a-entity id="level-info-panel" position="0 5 -15" visible="false">
        <a-plane width="6" height="3" color="#1a1a2e" material="opacity: 0.95; transparent: true"></a-plane>

        <a-text
          id="level-title"
          value="Selected Level"
          align="center"
          color="#00FFFF"
          width="10"
          position="0 1.1 0.01"
        ></a-text>

        <a-text
          id="level-desc"
          value="Level description"
          align="center"
          color="#FFFFFF"
          width="10"
          position="0 0.4 0.01"
          wrap-count="50"
        ></a-text>

        <a-text
          id="level-stats"
          value="Difficulty: -"
          align="center"
          color="#AAAAAA"
          width="9"
          position="0 -0.5 0.01"
        ></a-text>
      </a-entity>

      <!-- Botões seguem a câmera usando camera-follow -->
      <a-entity
        id="btn-back"
        camera-follow="offset: -1 -1 -2.5; smooth: true"
        vr-button="label: ← Back; width: 1.8; height: 0.5; color: #FF6B6B; action: back"
      ></a-entity>

      <a-entity
        id="btn-select"
        camera-follow="offset: 1 -1 -2.5; smooth: true"
        vr-button="label: Select →; width: 1.8; height: 0.5; color: #00ff88; action: select; disabled: true"
      ></a-entity>

      <!-- 12 Cristais dispostos em círculo ao redor do jogador -->
      <!-- A posição Y foi aumentada para 2.5 para não sobrepor os botões -->

      <!-- Nível 1 - 0° -->
      <a-entity id="level-1" position="0 2.5 -8" level-selector="levelId: 1; difficulty: easy">
        <a-octahedron
          position="0 0 0"
          radius="0.7"
          color="#00ff88"
          shadow="cast: true"
          material="metalness: 0.3; roughness: 0.1; transparent: true; opacity: 0.8; emissive: #00ff88; emissiveIntensity: 0"
          animation="property: rotation; to: 0 360 0; dur: 8000; loop: true"
          class="level-crystal interactive"
        ></a-octahedron>
        <a-text value="1" position="0 1 0" align="center" color="#00ff88" width="4"></a-text>
      </a-entity>

      <!-- Nível 2 - 30° -->
      <a-entity id="level-2" position="4 2.5 -6.9" level-selector="levelId: 2; difficulty: easy">
        <a-octahedron
          position="0 0 0"
          radius="0.7"
          color="#00ff88"
          shadow="cast: true"
          material="metalness: 0.3; roughness: 0.1; transparent: true; opacity: 0.8; emissive: #00ff88; emissiveIntensity: 0"
          animation="property: rotation; to: 0 360 0; dur: 8000; loop: true"
          class="level-crystal interactive"
        ></a-octahedron>
        <a-text value="2" position="0 1 0" align="center" color="#00ff88" width="4"></a-text>
      </a-entity>

      <!-- Nível 3 - 60° -->
      <a-entity id="level-3" position="6.9 2.5 -4" level-selector="levelId: 3; difficulty: easy">
        <a-octahedron
          position="0 0 0"
          radius="0.7"
          color="#00ff88"
          shadow="cast: true"
          material="metalness: 0.3; roughness: 0.1; transparent: true; opacity: 0.8; emissive: #00ff88; emissiveIntensity: 0"
          animation="property: rotation; to: 0 360 0; dur: 8000; loop: true"
          class="level-crystal interactive"
        ></a-octahedron>
        <a-text value="3" position="0 1 0" align="center" color="#00ff88" width="4"></a-text>
      </a-entity>

      <!-- Nível 4 - 90° -->
      <a-entity id="level-4" position="8 2.5 0" level-selector="levelId: 4; difficulty: medium">
        <a-octahedron
          position="0 0 0"
          radius="0.8"
          color="#ffdd00"
          shadow="cast: true"
          material="metalness: 0.3; roughness: 0.1; transparent: true; opacity: 0.8; emissive: #ffdd00; emissiveIntensity: 0"
          animation="property: rotation; to: 360 0 360; dur: 6000; loop: true"
          class="level-crystal interactive"
        ></a-octahedron>
        <a-text value="4" position="0 1 0" align="center" color="#ffdd00" width="4"></a-text>
      </a-entity>

      <!-- Nível 5 - 120° -->
      <a-entity id="level-5" position="6.9 2.5 4" level-selector="levelId: 5; difficulty: medium">
        <a-octahedron
          position="0 0 0"
          radius="0.8"
          color="#ffdd00"
          shadow="cast: true"
          material="metalness: 0.3; roughness: 0.1; transparent: true; opacity: 0.8; emissive: #ffdd00; emissiveIntensity: 0"
          animation="property: rotation; to: 360 0 360; dur: 6000; loop: true"
          class="level-crystal interactive"
        ></a-octahedron>
        <a-text value="5" position="0 1 0" align="center" color="#ffdd00" width="4"></a-text>
      </a-entity>

      <!-- Nível 6 - 150° -->
      <a-entity id="level-6" position="4 2.5 6.9" level-selector="levelId: 6; difficulty: medium">
        <a-octahedron
          position="0 0 0"
          radius="0.8"
          color="#ffdd00"
          shadow="cast: true"
          material="metalness: 0.3; roughness: 0.1; transparent: true; opacity: 0.8; emissive: #ffdd00; emissiveIntensity: 0"
          animation="property: rotation; to: 360 0 360; dur: 6000; loop: true"
          class="level-crystal interactive"
        ></a-octahedron>
        <a-text value="6" position="0 1 0" align="center" color="#ffdd00" width="4"></a-text>
      </a-entity>

      <!-- Nível 7 - 180° -->
      <a-entity id="level-7" position="0 2.5 8" level-selector="levelId: 7; difficulty: hard">
        <a-octahedron
          position="0 0 0"
          radius="0.9"
          color="#ff8800"
          shadow="cast: true"
          material="metalness: 0.3; roughness: 0.1; transparent: true; opacity: 0.8; emissive: #ff8800; emissiveIntensity: 0"
          animation="property: rotation; to: 0 360 720; dur: 4000; loop: true"
          class="level-crystal interactive"
        ></a-octahedron>
        <a-text value="7" position="0 1 0" align="center" color="#ff8800" width="4"></a-text>
      </a-entity>

      <!-- Nível 8 - 210° -->
      <a-entity id="level-8" position="-4 2.5 6.9" level-selector="levelId: 8; difficulty: hard">
        <a-octahedron
          position="0 0 0"
          radius="0.9"
          color="#ff8800"
          shadow="cast: true"
          material="metalness: 0.3; roughness: 0.1; transparent: true; opacity: 0.8; emissive: #ff8800; emissiveIntensity: 0"
          animation="property: rotation; to: 0 360 720; dur: 4000; loop: true"
          class="level-crystal interactive"
        ></a-octahedron>
        <a-text value="8" position="0 1 0" align="center" color="#ff8800" width="4"></a-text>
      </a-entity>

      <!-- Nível 9 - 240° -->
      <a-entity id="level-9" position="-6.9 2.5 4" level-selector="levelId: 9; difficulty: hard">
        <a-octahedron
          position="0 0 0"
          radius="0.9"
          color="#ff8800"
          shadow="cast: true"
          material="metalness: 0.3; roughness: 0.1; transparent: true; opacity: 0.8; emissive: #ff8800; emissiveIntensity: 0"
          animation="property: rotation; to: 0 360 720; dur: 4000; loop: true"
          class="level-crystal interactive"
        ></a-octahedron>
        <a-text value="9" position="0 1 0" align="center" color="#ff8800" width="4"></a-text>
      </a-entity>

      <!-- Nível 10 - 270° -->
      <a-entity id="level-10" position="-8 2.5 0" level-selector="levelId: 10; difficulty: expert">
        <a-octahedron
          position="0 0 0"
          radius="1"
          color="#ff0044"
          shadow="cast: true"
          material="metalness: 0.3; roughness: 0.1; transparent: true; opacity: 0.8; emissive: #ff0044; emissiveIntensity: 0"
          animation="property: rotation; to: 720 360 0; dur: 3000; loop: true"
          class="level-crystal interactive"
        ></a-octahedron>
        <a-text value="10" position="0 1 0" align="center" color="#ff0044" width="4"></a-text>
      </a-entity>

      <!-- Nível 11 - 300° -->
      <a-entity id="level-11" position="-6.9 2.5 -4" level-selector="levelId: 11; difficulty: expert">
        <a-octahedron
          position="0 0 0"
          radius="1"
          color="#ff0044"
          shadow="cast: true"
          material="metalness: 0.3; roughness: 0.1; transparent: true; opacity: 0.8; emissive: #ff0044; emissiveIntensity: 0"
          animation="property: rotation; to: 720 360 0; dur: 3000; loop: true"
          class="level-crystal interactive"
        ></a-octahedron>
        <a-text value="11" position="0 1 0" align="center" color="#ff0044" width="4"></a-text>
      </a-entity>

      <!-- Nível 12 - 330° -->
      <a-entity id="level-12" position="-4 2.5 -6.9" level-selector="levelId: 12; difficulty: expert">
        <a-octahedron
          position="0 0 0"
          radius="1"
          color="#ff0044"
          shadow="cast: true"
          material="metalness: 0.3; roughness: 0.1; transparent: true; opacity: 0.8; emissive: #ff0044; emissiveIntensity: 0"
          animation="property: rotation; to: 720 360 0; dur: 3000; loop: true"
          class="level-crystal interactive"
        ></a-octahedron>
        <a-text value="12" position="0 1 0" align="center" color="#ff0044" width="4"></a-text>
      </a-entity>

      <!-- Rig VR/Câmera -->
      <a-entity
        id="cameraRig"
        position="0 0 0"
        movement-controls="fly: false; constrainToNavMesh: false"
        snap-turn-controls="turnAngle: 45"
      >
        <!-- Câmera -->
        <a-camera
          id="mainCamera"
          position="0 1.6 5"
          look-controls="enabled: true; pointerLockEnabled: true"
          wasd-controls="enabled: true; acceleration: 20"
          cursor="rayOrigin: mouse"
        >
          <!-- Cursor visual -->
          <a-cursor
            vr-cursor-visual
            raycaster="objects: .interactive"
            animation__click="property: scale; startEvents: click; from: 0.1 0.1 0.1; to: 1 1 1; dur: 150"
            fuse="false"
          ></a-cursor>
        </a-camera>

        <!-- Controles VR -->
        <a-entity
          id="leftController"
          laser-controls="hand: left"
          raycaster="objects: .interactive; lineColor: #00FF00; lineOpacity: 0.5"
        ></a-entity>
        <a-entity
          id="rightController"
          laser-controls="hand: right"
          raycaster="objects: .interactive; lineColor: #00FFFF; lineOpacity: 0.5"
        ></a-entity>
      </a-entity>
    </a-scene>

    <!-- Scripts -->
    <script src="../components/vr-ui-components.js"></script>
    <script src="../components/level-ui-components.js"></script>
    <script type="module" src="../utils/scene-manager.js"></script>
    <script type="module" src="../js/level-select.js"></script>
  </body>
</html>
