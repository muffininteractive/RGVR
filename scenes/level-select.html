<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Level Select - Wacky Works VR</title>

    <!-- CSS -->
    <link rel="stylesheet" href="../css/style.css" />
    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>

    <!-- Environment Component -->
    <script src="https://unpkg.com/aframe-environment-component@1.5.x/dist/aframe-environment-component.min.js"></script>
  </head>
  <body>
    <!-- Cena A-Frame -->
    <a-scene id="level-select-scene" loading-screen="enabled: false">
      <!-- Assets -->
      <a-assets>
        <!-- Sons (placeholder) -->
        <audio id="hoverSound" preload="auto"></audio>
        <audio id="selectSound" preload="auto"></audio>
        <audio id="navSound" preload="auto"></audio>
      </a-assets>

      <!-- Ambiente -->
      <a-entity environment="preset: starry; groundColor: #1a1a2e; horizonColor: #000000"></a-entity>

      <!-- Iluminação -->
      <a-light type="ambient" color="#2a2a4a" intensity="0.5"></a-light>
      <a-light type="directional" position="5 10 5" color="#ffffff" intensity="0.6" castShadow="true"></a-light>
      <a-light type="point" position="0 5 0" color="#00ffff" intensity="0.8" distance="25"></a-light>

      <a-entity id="level-crystals" rotation="0 0 0"></a-entity>
      <!-- Título em VR -->
      <a-entity position="0 9 -13">
        <a-text
          value="LEVEL SELECT"
          position="0 -1 0"
          align="center"
          color="#00FFFF"
          width="11"
          animation="property: scale; to: 1.05 1.05 1.05; dur: 2000; dir: alternate; loop: true"
        ></a-text>

        <!-- Subtítulo -->
        <a-text
          value="Choose your difficulty level"
          position="0 -2 0"
          align="center"
          color="#FFFFFF"
          width="8"
        ></a-text>

        <!-- Instruções gerais -->
        <a-text
          value="Point at a crystal and click to select the level"
          position="0 -3 0"
          align="center"
          color="#ffffff"
          width="8"
        ></a-text>
      </a-entity>

      <!-- Painel de informações do nível (HUD VR) - Reposicionado para trás e para cima -->
      <a-entity id="level-info-panel" position="0 6 -10" visible="false">
        <a-plane width="6" height="3" color="#1a1a2e" material="opacity: 0.95; transparent: true"></a-plane>

        <a-text
          id="level-title"
          value="Selected Level"
          align="center"
          color="#00FFFF"
          width="10"
          position="0 1.1 0.01"
        ></a-text>

        <a-text
          id="level-desc"
          value="Level description"
          align="center"
          color="#FFFFFF"
          width="10"
          position="0 0.4 0.01"
          wrap-count="50"
        ></a-text>

        <a-text
          id="level-stats"
          value="Difficulty: -"
          align="center"
          color="#AAAAAA"
          width="9"
          position="0 -0.5 0.01"
        ></a-text>
      </a-entity>

      <!-- Botões seguem a câmera usando camera-follow -->
      <a-entity
        id="btn-back"
        position="-1 0.5 -3"
        vr-button="label: ← Back; width: 1.8; height: 0.5; color: #FF6B6B; action: back"
      ></a-entity>

      <a-entity
        id="btn-select"
        position="1 0.5 -3"
        vr-button="label: Select →; width: 1.8; height: 0.5; color: #00ff88; action: select; disabled: true"
      ></a-entity>
      <a-entity position="2.5 0.5 -3" scale="0.5 0.5 0.5">
        <a-triangle
          id="rotate-right"
          rotation="0 0 -90"
          color="#00FFFF"
          class="interactive"
          animation__hover_scale="startEvents: mouseenter; property: scale; from: 1 1 1; to: 1.1 1.1 1; dur: 150"
          animation__unhover_scale="startEvents: mouseleave; property: scale; to: 1 1 1; dur: 150"
          animation__hover_color="startEvents: mouseenter; property: material.color; to: #66ffbb; dur: 150"
          animation__unhover_color="startEvents: mouseleave; property: material.color; to: #00FFFF; dur: 150"
          animation__click="startEvents: click; property: scale; from: 1.1 1.1 1; to: 0.95 0.95 1; dur: 100; dir: alternate"
        ></a-triangle>
      </a-entity>
      <a-entity position="-2.5 0.5 -3" scale="0.5 0.5 0.5">
        <a-triangle
          id="rotate-left"
          rotation="0 0 90"
          color="#00FFFF"
          class="interactive"
          animation__hover_scale="startEvents: mouseenter; property: scale; from: 1 1 1; to: 1.1 1.1 1; dur: 150"
          animation__unhover_scale="startEvents: mouseleave; property: scale; to: 1 1 1; dur: 150"
          animation__hover_color="startEvents: mouseenter; property: material.color; to: #66ffbb; dur: 150"
          animation__unhover_color="startEvents: mouseleave; property: material.color; to: #00FFFF; dur: 150"
          animation__click="startEvents: click; property: scale; from: 1.1 1.1 1; to: 0.95 0.95 1; dur: 100; dir: alternate"
        ></a-triangle>
      </a-entity>
      <!-- Rig VR/Câmera -->
      <a-entity
        id="cameraRig"
        position="0 0 0"
        movement-controls="fly: false; constrainToNavMesh: false"
        snap-turn-controls="turnAngle: 45"
      >
        <!-- Câmera -->
        <a-camera
          id="mainCamera"
          position="0 1.7 0"
          look-controls="enabled: false; pointerLockEnabled: false"
          wasd-controls="enabled: false; acceleration: 20"
          cursor="rayOrigin: mouse"
        >
        </a-camera>

        <!-- Controles VR -->
        <a-entity
          id="leftController"
          laser-controls="hand: left"
          raycaster="objects: .interactive; lineColor: #00FF00; lineOpacity: 0.5"
        ></a-entity>
        <a-entity
          id="rightController"
          laser-controls="hand: right"
          raycaster="objects: .interactive; lineColor: #00FFFF; lineOpacity: 0.5"
        ></a-entity>
      </a-entity>
    </a-scene>
  </body>
  <!-- Components -->
  <script src="../components/vr-ui-components.js"></script>
  <script src="../components/level-ui-components.js"></script>
  <script type="module" src="../js/level-select.js"></script>
</html>
