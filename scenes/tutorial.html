<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tutorial - Wacky Works VR</title>

    <!-- CSS personalizado -->
    <link rel="stylesheet" href="../css/style.css" />

    <!-- A-Frame CDN -->
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-environment-component@1.5.x/dist/aframe-environment-component.min.js"></script>
    
    <!-- Physics System (Cannon.js) -->
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-physics-system@v4.0.1/dist/aframe-physics-system.min.js"></script>
  </head>
  <body>
    <!-- Cena A-Frame -->
    <a-scene
      vr-mode-ui="enabled: true"
      style="height: 100vh; width: 100vw"
      background="color: #87CEEB"
      fog="type: linear; color: #87CEEB; near: 10; far: 100"
      physics="driver: cannon; gravity: -9.8; debug: false"
    >
      <!-- Assets -->
      <a-assets>
        <!-- Texturas -->
        <img id="groundTexture" src="https://cdn.aframe.io/a-painter/images/floor.jpg" />
        
        <!-- Mixins para objetos -->
        <a-mixin id="tutorial-object" shadow="cast: true; receive: true" class="interactive grab"></a-mixin>
      </a-assets>

      <!-- Iluminação -->
      <a-light type="ambient" color="#fff" intensity=".6"></a-light>
      <a-light type="directional" position="5 10 5" color="#ffffff" intensity="0.8" castShadow="true"></a-light>

      <!-- Ambiente -->
      <a-entity environment="preset: forest; groundColor: #445; grid: cross"></a-entity>

      <!-- Título VR -->
      <a-text
        value="WELCOME TO WACKY WORKS VR!"
        position="0 3.5 -5"
        align="center"
        color="#00FFFF"
        font="roboto"
        width="10"
        animation="property: scale; to: 1.05 1.05 1.05; dur: 2000; dir: alternate; loop: true"
      ></a-text>

      <!-- Instruções principais VR -->
      <a-entity id="instructions-panel" position="0 2 -5">
        <a-plane
          width="5"
          height="3"
          color="#1a1a2e"
          material="opacity: 0.9; transparent: true"
        ></a-plane>

        <a-text
          value="HOW TO PLAY"
          align="center"
          color="#00FFFF"
          width="9"
          position="0 1.2 0.01"
          font="roboto"
        ></a-text>

        <a-text
          value="1. Use WASD or VR joystick to move\n\n2. Look around by moving mouse or head\n\n3. Press VR trigger to grab objects\n\n4. Bring compatible objects close to connect\n\n5. Complete the path from START to END"
          align="center"
          color="#FFFFFF"
          width="9"
          position="0 0 0.01"
          font="roboto"
          wrap-count="40"
          line-height="50"
        ></a-text>
      </a-entity>

      <!-- Botões de ação VR -->
      <a-entity id="tutorial-buttons" position="0 0.5 -3">
        <a-entity
          vr-button="label: 🎮 Começar Jogo; width: 2.5; height: 0.6; color: #7BC8A4; action: start"
          position="0 0 0"
        ></a-entity>

        <a-entity
          vr-button="label: ⏭️ Pular Tutorial; width: 2.5; height: 0.6; color: #FFC65D; action: skip"
          position="0 -0.8 0"
        ></a-entity>

        <a-entity
          vr-button="label: ← Voltar; width: 2.5; height: 0.6; color: #FF6B6B; action: back"
          position="0 -1.6 0"
        ></a-entity>
      </a-entity>

      <!-- Objetos de demonstração -->
      <a-box
        id="start-cube"
        position="-3 1 -8"
        color="#FF6B6B"
        class="interactive grab"
        shadow
      >
        <a-text
          value="INÍCIO"
          position="0 1.5 0"
          align="center"
          color="#FFFFFF"
          font="roboto"
          width="8"
        ></a-text>
      </a-box>

      <a-sphere
        id="middle-sphere"
        position="0 1.25 -8"
        radius="0.8"
        color="#4CC3D9"
        class="interactive grab"
        shadow
      >
        <a-text
          value="MEIO"
          position="0 1.5 0"
          align="center"
          color="#FFFFFF"
          font="roboto"
          width="8"
        ></a-text>
      </a-sphere>

      <a-cylinder
        id="end-cylinder"
        position="3 0.75 -8"
        radius="0.6"
        height="1.5"
        color="#7BC8A4"
        class="interactive grab"
        shadow
        animation="property: rotation; to: 0 360 0; dur: 3000; loop: true"
      >
        <a-text
          value="FIM"
          position="0 1.5 0"
          align="center"
          color="#FFFFFF"
          font="roboto"
          width="8"
        ></a-text>
      </a-cylinder>

      <!-- Rig VR/Câmera -->
      <a-entity
        id="cameraRig"
        position="0 0 0"
        movement-controls="fly: false; constrainToNavMesh: false"
        snap-turn-controls="turnAngle: 45"
      >
        <!-- Câmera -->
        <a-camera
          id="mainCamera"
          position="0 1.6 5"
          look-controls="enabled: true; pointerLockEnabled: true"
          wasd-controls="enabled: true; acceleration: 20"
          cursor="rayOrigin: mouse"
        >
          <!-- Cursor VR -->
          <a-cursor
            vr-cursor-visual
            raycaster="objects: .interactive"
            animation__click="property: scale; startEvents: click; from: 0.1 0.1 0.1; to: 1 1 1; dur: 150"
            fuse="false"
          ></a-cursor>
        </a-camera>

        <!-- Controles VR -->
        <a-entity
          id="leftController"
          laser-controls="hand: left"
          raycaster="objects: .interactive, .grab; showLine: true; far: 50; lineColor: #00FF00; lineOpacity: 0.5"
        ></a-entity>
        <a-entity
          id="rightController"
          laser-controls="hand: right"
          raycaster="objects: .interactive, .grab; showLine: true; far: 50; lineColor: #00FFFF; lineOpacity: 0.5"
        ></a-entity>
      </a-entity>
    </a-scene>

    <!-- Scripts -->
    <script src="../components/vr-ui-components.js"></script>
    <script type="module" src="../utils/scene-manager.js"></script>
    <script type="module">
      import { SceneManager } from '../utils/scene-manager.js';

      document.addEventListener('DOMContentLoaded', () => {
        const scene = document.querySelector('a-scene');
        
        if (scene.hasLoaded) {
          setupTutorial();
        } else {
          scene.addEventListener('loaded', setupTutorial);
        }
      });

      function setupTutorial() {
        console.log('Tutorial loaded');
        
        // Botões VR
        const buttons = document.querySelectorAll('[vr-button]');
        buttons.forEach(button => {
          button.addEventListener('vr-button-clicked', (e) => {
            const action = e.detail.action;
            switch (action) {
              case 'start':
                SceneManager.loadScene('level-select');
                break;
              case 'skip':
                SceneManager.loadScene('level-select');
                break;
              case 'back':
                window.location.href = '../index.html';
                break;
            }
          });
        });

        // Atalhos de teclado
        document.addEventListener('keydown', (event) => {
          switch (event.key) {
            case 'Enter':
              SceneManager.loadScene('level-select');
              break;
            case 'Escape':
              window.location.href = '../index.html';
              break;
          }
        });
      }
    </script>
  </body>
</html>

              window.TutorialManager.onObjectGrabbed(objects.end);
            }
          });
        }
      }, 2000);
    </script>
  </body>
</html>
