<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Physics Demo - Wacky Works VR</title>

    <!-- CSS -->
    <link rel="stylesheet" href="../css/style.css" />

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>

    <!-- Physics System (Cannon.js) - Versão compatível com THREE.js r173 -->
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-physics-system@v4.2.2/dist/aframe-physics-system.min.js"></script>

    <style>
      #info-panel {
        position: fixed;
        top: 10px;
        left: 10px;
        background: rgba(0, 0, 0, 0.8);
        color: white;
        padding: 15px;
        border-radius: 8px;
        font-family: 'Courier New', monospace;
        max-width: 400px;
        z-index: 1000;
      }
      #info-panel h2 {
        margin: 0 0 10px 0;
        color: #00ffff;
      }
      #info-panel p {
        margin: 5px 0;
        font-size: 14px;
      }
      #info-panel button {
        margin-top: 10px;
        padding: 8px 15px;
        background: #00ffff;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-weight: bold;
      }
      #info-panel button:hover {
        background: #00cccc;
      }
    </style>
  </head>
  <body>
    <!-- Info Panel -->
    <div id="info-panel">
      <h2>🎮 Demo Física Cannon.js</h2>
      <p><strong>Controles:</strong></p>
      <p>• WASD - Mover</p>
      <p>• Mouse - Olhar</p>
      <p>• Espaço - Soltar bola</p>
      <p>• 1 - Peso na ESQUERDA da alavanca</p>
      <p>• 2 - Peso na DIREITA da alavanca</p>
      <p>• R - Reset</p>
      <p>• D - Debug ON/OFF</p>
      <button id="drop-ball">Soltar Bola</button>
      <button id="lever-left">Peso Esquerda</button>
      <button id="lever-right">Peso Direita</button>
      <button id="toggle-debug">Debug</button>
      <button id="reset-scene">Reset</button>
    </div>

    <!-- Cena A-Frame com Física -->
    <a-scene physics="debug: false" background="color: #1a1a2e" fog="type: linear; color: #1a1a2e; near: 10; far: 50">
      <!-- Iluminação -->
      <a-light type="ambient" color="#ffffff" intensity="0.5"></a-light>
      <a-light type="directional" position="5 10 5" intensity="0.8" castShadow="true"></a-light>
      <a-light type="point" position="0 5 0" color="#00ffff" intensity="0.5"></a-light>

      <!-- Chão físico -->
      <a-plane
        id="ground"
        position="0 0 0"
        rotation="-90 0 0"
        width="30"
        height="30"
        color="#2a2a4a"
        static-body
        shadow="receive: true"
        material="roughness: 0.8; metalness: 0.2"
      ></a-plane>

      <!-- Grid visual -->
      <a-plane
        position="0 0.01 0"
        rotation="-90 0 0"
        width="30"
        height="30"
        color="#3a3a5a"
        material="shader: flat; transparent: true; opacity: 0.3"
      ></a-plane>

      <!-- ===== DEMO 1: Rampa com Esfera ===== -->
      <a-text value="DEMO 1: Rampa" position="-8 2.5 -5" color="#00ffff" align="center" width="4"></a-text>

      <!-- Rampa -->
      <a-box
        id="ramp1"
        position="-8 1.5 -5"
        rotation="0 0 -20"
        width="4"
        height="0.3"
        depth="3"
        color="#555555"
        static-body
        material="roughness: 0.2; metalness: 0.8"
        shadow="cast: true; receive: true"
      ></a-box>

      <!-- Esfera no topo -->
      <a-sphere
        id="ball1"
        position="-9 3.5 -5"
        radius="0.4"
        color="#ff0000"
        dynamic-body="mass: 1; linearDamping: 0.1; angularDamping: 0.1"
        shadow="cast: true"
      ></a-sphere>

      <!-- ===== DEMO 2: Dominós ===== -->
      <a-text value="DEMO 2: Dominós" position="0 2.5 -5" color="#00ffff" align="center" width="4"></a-text>

      <!-- Dominó 1 -->
      <a-box
        class="domino"
        position="-1 1 -5"
        width="0.3"
        height="2"
        depth="1"
        color="#8B4513"
        dynamic-body="mass: 0.5; linearDamping: 0.3; angularDamping: 0.2"
        shadow="cast: true"
      ></a-box>

      <!-- Dominó 2 -->
      <a-box
        class="domino"
        position="0.2 1 -5"
        width="0.3"
        height="2"
        depth="1"
        color="#8B4513"
        dynamic-body="mass: 0.5; linearDamping: 0.3; angularDamping: 0.2"
        shadow="cast: true"
      ></a-box>

      <!-- Dominó 3 -->
      <a-box
        class="domino"
        position="1.4 1 -5"
        width="0.3"
        height="2"
        depth="1"
        color="#8B4513"
        dynamic-body="mass: 0.5; linearDamping: 0.3; angularDamping: 0.2"
        shadow="cast: true"
      ></a-box>

      <!-- Dominó 4 -->
      <a-box
        class="domino"
        position="2.6 1 -5"
        width="0.3"
        height="2"
        depth="1"
        color="#8B4513"
        dynamic-body="mass: 0.5; linearDamping: 0.3; angularDamping: 0.2"
        shadow="cast: true"
      ></a-box>

      <!-- Esfera ativadora -->
      <a-sphere
        id="domino-ball"
        position="-2.5 1.5 -5"
        radius="0.4"
        color="#00ff00"
        dynamic-body="mass: 2; linearDamping: 0.1; angularDamping: 0.1"
        shadow="cast: true"
      ></a-sphere>

      <!-- ===== DEMO 3: Cubo vs Esfera ===== -->
      <a-text value="DEMO 3: Colisões" position="8 2.5 -5" color="#00ffff" align="center" width="4"></a-text>

      <!-- Cubo pesado -->
      <a-box
        id="heavy-cube"
        position="7 0.5 -5"
        width="1"
        height="1"
        depth="1"
        color="#0000ff"
        dynamic-body="mass: 5; linearDamping: 0.05; angularDamping: 0.05"
        shadow="cast: true"
        material="roughness: 0.6; metalness: 0.4"
      ></a-box>

      <!-- Esfera leve que quica -->
      <a-sphere
        id="bouncy-ball"
        position="9 3 -5"
        radius="0.5"
        color="#ffff00"
        dynamic-body="mass: 0.5; linearDamping: 0.05; angularDamping: 0.05"
        shadow="cast: true"
      ></a-sphere>

      <!-- ===== DEMO 4: Alavanca (Placeholder) ===== -->
      <a-text value="DEMO 4: Alavanca" position="0 2.5 -12" color="#00ffff" align="center" width="4"></a-text>
      <a-text
        value="Pressione 1 (esquerda) ou 2 (direita)"
        position="0 2.2 -12"
        color="#ffffff"
        align="center"
        width="3"
        scale="0.8 0.8 0.8"
      ></a-text>

      <!-- Base da alavanca (fulcro) -->
      <a-cylinder
        id="lever-fulcrum"
        position="0 0.5 -12"
        radius="0.5"
        height="1"
        color="#666666"
        static-body
        shadow="receive: true"
      ></a-cylinder>

      <!-- Braço da alavanca - com pequeno cilindro no centro para apoio visual -->
      <a-cylinder
        position="0 1 -12"
        radius="0.15"
        height="0.3"
        rotation="90 0 0"
        color="#333333"
        static-body
      ></a-cylinder>

      <!-- Braço da alavanca -->
      <a-box
        id="lever-arm"
        position="0 1.15 -12"
        width="4.5"
        height="0.15"
        depth="0.5"
        color="#ff6600"
        dynamic-body="mass: 2; angularDamping: 0.6; linearDamping: 0.9"
        shadow="cast: true"
      ></a-box>

      <!-- Plataformas nas extremidades (agora dinâmicas e parte da alavanca) -->
      <a-box
        class="lever-platform"
        position="-2 1.15 -12"
        width="0.8"
        height="0.1"
        depth="0.8"
        color="#ff4444"
        dynamic-body="mass: 0.3"
        shadow="cast: true"
      ></a-box>

      <a-box
        class="lever-platform"
        position="2 1.15 -12"
        width="0.8"
        height="0.1"
        depth="0.8"
        color="#44ff44"
        dynamic-body="mass: 0.3"
        shadow="cast: true"
      ></a-box>

      <!-- Indicador visual -->
      <a-sphere
        position="-1.5 1 -12"
        radius="0.2"
        color="#ff0000"
        material="emissive: #ff0000; emissiveIntensity: 0.5"
      ></a-sphere>

      <a-sphere
        position="1.5 1 -12"
        radius="0.2"
        color="#00ff00"
        material="emissive: #00ff00; emissiveIntensity: 0.5"
      ></a-sphere>

      <!-- Paredes invisíveis (limites) -->
      <a-box position="15 2 0" width="1" height="4" depth="30" static-body visible="false"></a-box>
      <a-box position="-15 2 0" width="1" height="4" depth="30" static-body visible="false"></a-box>
      <a-box position="0 2 -15" width="30" height="4" depth="1" static-body visible="false"></a-box>
      <a-box position="0 2 15" width="30" height="4" depth="1" static-body visible="false"></a-box>

      <!-- Câmera e Controles -->
      <a-entity id="rig" position="0 1.6 5">
        <a-camera look-controls wasd-controls="acceleration: 15">
          <a-cursor color="#00ffff"></a-cursor>
        </a-camera>
      </a-entity>
    </a-scene>

    <!-- Script de Controle -->
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const scene = document.querySelector('a-scene');
        const physicsSystem = scene.systems.physics;
        let debugMode = false;
        let ballCount = 0;

        // Configura propriedades físicas após carregar
        scene.addEventListener('loaded', () => {
          console.log('✅ Física Cannon.js carregada!');

          // Aplica propriedades de material físico
          setupPhysicsMaterials();
        });

        // Função para configurar materiais físicos
        function setupPhysicsMaterials() {
          // Bola 1 - Borracha (quica)
          const ball1 = document.querySelector('#ball1');
          if (ball1 && ball1.body) {
            ball1.body.material.restitution = 0.8;
            ball1.body.material.friction = 0.3;
          }

          // Rampa - Lisa
          const ramp1 = document.querySelector('#ramp1');
          if (ramp1 && ramp1.body) {
            ramp1.body.material.friction = 0.1;
            ramp1.body.material.restitution = 0.2;
          }

          // Dominós - Madeira
          document.querySelectorAll('.domino').forEach(domino => {
            if (domino.body) {
              domino.body.material.friction = 0.9;
              domino.body.material.restitution = 0.1;
            }
          });

          // Bola quicante
          const bouncyBall = document.querySelector('#bouncy-ball');
          if (bouncyBall && bouncyBall.body) {
            bouncyBall.body.material.restitution = 0.9;
            bouncyBall.body.material.friction = 0.2;
          }

          console.log('✅ Materiais físicos configurados');
        }

        // Botão: Soltar bola
        document.getElementById('drop-ball').addEventListener('click', () => {
          ballCount++;
          const ball = document.createElement('a-sphere');
          ball.setAttribute('position', `${Math.random() * 4 - 2} 5 ${-5 + Math.random() * 4 - 2}`);
          ball.setAttribute('radius', '0.3');
          ball.setAttribute('color', `#${Math.floor(Math.random() * 16777215).toString(16)}`);
          ball.setAttribute('dynamic-body', {
            mass: 1,
            linearDamping: 0.1,
            angularDamping: 0.1,
          });
          ball.setAttribute('shadow', 'cast: true');

          scene.appendChild(ball);

          // Configura material após carregar
          ball.addEventListener('body-loaded', () => {
            ball.body.material.restitution = 0.7;
            ball.body.material.friction = 0.3;
          });

          console.log(`🎾 Bola ${ballCount} solta!`);
        });

        // Botão: Toggle Debug
        document.getElementById('toggle-debug').addEventListener('click', () => {
          debugMode = !debugMode;
          scene.setAttribute('physics', 'debug', debugMode);
          console.log(`🐛 Debug: ${debugMode ? 'ON' : 'OFF'}`);
        });

        // Botão: Reset
        document.getElementById('reset-scene').addEventListener('click', () => {
          location.reload();
        });

        // Função para soltar peso na alavanca
        function dropWeightOnLever(side) {
          const weight = document.createElement('a-sphere');
          const xPos = side === 'left' ? -2 : 2;

          weight.setAttribute('position', `${xPos} 3.5 -12`);
          weight.setAttribute('radius', '0.4');
          weight.setAttribute('color', side === 'left' ? '#ff0000' : '#00ff00');
          weight.setAttribute('dynamic-body', {
            mass: 8,
            linearDamping: 0.01,
            angularDamping: 0.01,
          });
          weight.setAttribute('shadow', 'cast: true');

          scene.appendChild(weight);

          // Configura material após carregar
          weight.addEventListener('body-loaded', () => {
            weight.body.material.restitution = 0.1;
            weight.body.material.friction = 1.0;
          });

          console.log(`⚖️ Peso de 8kg solto na ${side === 'left' ? 'ESQUERDA' : 'DIREITA'}`);
        } // Botão: Peso Esquerda
        document.getElementById('lever-left').addEventListener('click', () => {
          dropWeightOnLever('left');
        });

        // Botão: Peso Direita
        document.getElementById('lever-right').addEventListener('click', () => {
          dropWeightOnLever('right');
        });

        // Teclas de atalho
        document.addEventListener('keydown', e => {
          switch (e.key.toLowerCase()) {
            case ' ':
              document.getElementById('drop-ball').click();
              break;
            case '1':
              document.getElementById('lever-left').click();
              break;
            case '2':
              document.getElementById('lever-right').click();
              break;
            case 'd':
              document.getElementById('toggle-debug').click();
              break;
            case 'r':
              document.getElementById('reset-scene').click();
              break;
          }
        });

        // Log de colisões
        scene.addEventListener('collide', evt => {
          console.log('💥 Colisão detectada!', evt.detail);
        });

        console.log('🎮 Demo de Física iniciada!');
        console.log('Pressione ESPAÇO para soltar bolas');
        console.log('Pressione 1 para peso na ESQUERDA da alavanca');
        console.log('Pressione 2 para peso na DIREITA da alavanca');
        console.log('Pressione D para debug');
        console.log('Pressione R para reset');
      });
    </script>
  </body>
</html>
