<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>River Raid VR Procedural</title>
    <link rel="stylesheet" href="./css/style.css" />
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.6.0/dist/aframe-extras.min.js"></script>
    <script src="https://unpkg.com/aframe-environment-component@1.5.x/dist/aframe-environment-component.min.js"></script>
  </head>
  <body>
    <div id="ui-overlay">
      <div class="info-panel">
        <h1>River Raid VR Procedural</h1>
        <p>Use o thumbstick do controle VR para mover (X e velocidade Z). WASD também funciona no teclado.</p>
      </div>
    </div>
    <a-scene vr-mode-ui="enabled: true" embedded style="height: 100vh; width: 100vw" background="color: #87CEEB">
      <a-assets>
        <img id="carpeTex" src="./assets/carpetex2.png" />
      </a-assets>
      <a-light type="ambient" color="#fff" intensity=".5"></a-light>
      <a-light type="directional" position="5 10 5" color="#ffffff" intensity="0.8" castShadow="true"></a-light>

      <a-entity id="riverRaidManager" river-raid-proc></a-entity>
      <a-entity id="cameraRig" position="0 2 0" river-raid-controls>
        <a-camera
          id="mainCamera"
          position="0 2 0"
          look-controls="enabled: true; pointerLockEnabled: true"
          wasd-controls="enabled: false;"
        ></a-camera>

        <a-entity
          environment="skyType: atmosphere;horizonColor: #ddd;lightPosition: 0 0.1 -5;fog: 0.9; lighting: distant; shadow: true;  ground: none; horizonColor: #b3e0ff; seed: 42;stageSize: 5000; playArea: 50"
        ></a-entity>
        <a-entity
          meta-touch-controls="hand: right; model: true"
          laser-controls="hand: right"
          class="right-control"
        ></a-entity>
        <a-entity
          meta-touch-controls="hand: left; model: true"
          laser-controls="hand: left"
          class="left-control"
        ></a-entity>
      </a-entity>
    </a-scene>
    <script type="module" src="./js/river-raid-proc.js"></script>
  </body>
</html>
